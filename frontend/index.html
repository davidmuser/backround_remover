<!DOCTYPE html>
<html lang="he" dir="rtl"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מכונת הסרת הרקע - AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>מכונת הסרת רקע - AI</h1>
            <p>העלה תמונה, והבינה המלאכותית שלנו תעשה את כל השאר בחינם!</p>
        </header>

        <div class="upload-section">
            <label for="imageInput" class="upload-box">
                <span class="upload-icon">⬆️</span>
                <span class="upload-text">לחץ כאן לבחירת תמונה</span>
                <input type="file" id="imageInput" accept="image/*">
            </label>
        </div>

        <div class="action-section">
            <button id="removeBtn" aria-describedby="status">הסר רקע</button>
            <div id="loader" class="loader" style="display: none;" aria-hidden="true">מעבד את התמונה...</div>
            <!-- inline status messages replace alert() for better UX and accessibility -->
            <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>

        <div class="result-section">
            <div class="result-box" id="resultContainer">
                <img id="resultImage" class="result-img" alt="התוצאה תופיע כאן">
            </div>
            <a id="downloadLink" class="download-btn" style="display: none;">הורד תמונה (PNG)</a>
        </div>
    </div>
    <!-- Optional: set BACKEND_URL here for development or overrides -->
    <script>
        // Change this to your local backend when testing, e.g. http://localhost:8000
        window.BACKEND_URL = 'https://backroundremover-production.up.railway.app';
    </script>
    <script src="app.js"></script>
</body>
</html>
