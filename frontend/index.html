<!DOCTYPE html>
<html lang="he" dir="rtl"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מכונת הסרת הרקע - AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>מכונת הסרת רקע - AI</h1>
            <p>העלה תמונה, והבינה המלאכותית שלנו תעשה את כל השאר בחינם!</p>
        </header>

        <div class="upload-section">
            <label for="imageInput" class="upload-box" id="uploadBox" tabindex="0">
                <span class="upload-icon">⬆️</span>
                <span class="upload-text">לחץ כאן לבחירת תמונה או גרור לכאן</span>
                <input type="file" id="imageInput" accept="image/*">
                <!-- thumbnail preview inside the upload box -->
                <img id="previewThumb" class="preview-thumb" alt="תצוגה מקדימה" style="display:none">
            </label>
        </div>

        <div class="action-section">
            <div class="controls">
                <button id="removeBtn" aria-describedby="status" class="primary">הסר רקע</button>
                <button id="resetBtn" class="secondary" aria-label="נקה">נקה</button>
            </div>
            <div id="loader" class="loader" style="display: none;" aria-hidden="true">מעבד את התמונה...</div>
            <div class="progress-wrapper" style="display:none;" aria-hidden="true">
                <div id="progressBar" class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
            </div>
            <!-- inline status messages replace alert() for better UX and accessibility -->
            <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>

        <div class="result-section">
            <div class="result-box" id="resultContainer">
                <img id="resultImage" class="result-img" alt="התוצאה תופיע כאן">
            </div>
            <a id="downloadLink" class="download-btn" style="display: none;" aria-hidden="true">
                <!-- download icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M19 14l-7 7-7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                הורד תמונה (PNG)
            </a>
        </div>
    </div>
    <!-- Optional: set BACKEND_URL here for development or overrides -->
    <script>
        // Change this to your local backend when testing, e.g. http://localhost:8000
        window.BACKEND_URL = 'https://backroundremover-production.up.railway.app';
    </script>
    <script src="app.js"></script>
</body>
</html>
